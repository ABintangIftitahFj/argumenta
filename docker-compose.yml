services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: argumenta
      MYSQL_USER: argumenta
      MYSQL_PASSWORD: argumenta-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uargumenta", "-pargumenta-local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
