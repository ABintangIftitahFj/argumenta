name: Push validation

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f plan/prd.md
          test -f task.md
          test -f .gitignore

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build application image
        run: docker build --tag argumenta:ci .

      - name: Run test suite
        run: docker run --rm argumenta:ci php artisan test
